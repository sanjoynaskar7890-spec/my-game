name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer
      uses: kivy/buildozer-action@v1
      with:
        filename: buildozer.spec
        release: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
