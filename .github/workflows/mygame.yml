name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git wget unzip build-essential \
          libltdl-dev libffi-dev libssl-dev python3-pip \
          openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake

    - name: Cache Buildozer Directories
      uses: actions/cache@v4
      with:
        path: |
          .buildozer
          ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0" buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer android debug --log_level=2

    - name: Upload to GitHub Release (Permanent Link)
      uses: softprops/action-gh-release@v2
      with:
        files: bin/*.apk
        tag_name: latest-apk
        name: "Hyper Shift: Ultra Pro Max - Beta APK"
        body: "Automatic build for the latest game update with 120 FPS and weather"
        prerelease: false
        overwrite: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
